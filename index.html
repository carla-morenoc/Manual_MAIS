<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio MAIS</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --primary: #ffffff;
    --secondary: #333333;
    --accent: #b91c1c;
    --glass: transparent;
    --radius: 8px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding: 20px 0;
    background: #000000 !important;
    overflow: hidden;
}

/* Contenedor principal */
.container{
    position:relative;
    text-align:center;
    padding:30px 20px;
    background: transparent;
    color:white;
    width:min(95%, 620px);
    max-width:620px;
    animation: fadeInUp 1s ease;
    z-index: 10;
}

/* Animación entrada */
@keyframes fadeInUp{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}

/* 🎥 CONTENEDOR DE VÍDEO GRANDE DESDE EL PRINCIPIO Y ZOOM CINEMÁTICO */
.video-wrapper {
    position: relative;
    width: 480px; /* Tamaño grande de primeras en pantalla */
    height: 300px;
    max-width: 90vw;
    margin: 0 auto 25px auto;
    border-radius: 12px;
    overflow: hidden;
    /* Transición suave para el zoom cinemático */
    transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.2s ease;
    z-index: 5;
}

.video-wrapper video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Difuminado radial para fusionar el fondo gris del vídeo con el negro de la página */
.video-vignette {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, transparent 40%, #000000 80%);
    pointer-events: none;
}

/* Efecto Zoom: se agranda y acerca la cámara aún más al acabar el video */
.video-wrapper.zoomed {
    transform: scale(2.4) translateY(12%);
    opacity: 0.85; /* Se mantiene visible de fondo con contraste */
    pointer-events: none;
}

/* 📝 CONTENEDOR DE CONTENIDO HTML (Textos y formulario) */
#login-content {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1), transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
}

#login-content.visible {
    opacity: 1;
    transform: translateY(0);
}

/* Estilos de textos */
h1 {
    font-size: 2.6rem;
    font-weight: 700;
    margin-bottom: 15px;
    letter-spacing: 1px;
    color: #ffffff;
}

p {
    opacity: 0.9;
    margin-bottom: 35px;
    font-size: 1rem;
    color: #ffffff;
}

/* Botón moderno */
.btn{
    position:relative;
    display:inline-block;
    padding:14px 35px;
    font-size:1.1rem;
    font-weight:600;
    border-radius: 50px;
    text-decoration:none;
    color:white;
    background: transparent;
    border: 1px solid white;
    overflow:hidden;
    transition:0.4s ease;
}

.btn:hover{
    transform:translateY(-4px);
    background: white;
    color: black;
}

.btn-ghost{
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    padding:12px 30px;
    border-radius: 50px;
    cursor: pointer;
    font-weight:600;
    transition: 0.3s;
}
.btn-ghost:hover{ 
    background: var(--accent); 
    color: white; 
    box-shadow: 0 0 12px rgba(185, 28, 28, 0.4);
}

/* Input moderno */
input.input-empresa{
    width:100%;
    padding:12px 14px;
    margin:10px 0 20px 0;
    border-radius:12px;
    border: 1px solid #333;
    background: rgba(10, 10, 10, 0.5);
    color: white;
    outline: none;
    transition: 0.3s;
    text-align: center;
}
input.input-empresa:focus {
    border-color: var(--accent);
    box-shadow: 0 0 8px rgba(185, 28, 28, 0.5);
}
input.input-empresa::placeholder{ color: rgba(255,255,255,0.4); }

@media(max-width:600px){
    body { padding: 16px 0; }
    .container{padding:32px 20px; width:92%;}
    .btn-ghost{width:100%; padding:14px 20px;}
    h1 { font-size: 2rem; }
}
</style>
</head>

<body>

<div class="container" id="mainContainer">
    
    <!-- Contenedor del Vídeo sin loop inicial y grande desde el principio -->
    <div class="video-wrapper" id="videoWrapper">
        <video id="loginVideo" autoplay muted playsinline>
            <source src="assets/videos/animacionindex2.mp4" type="video/mp4">
            Tu navegador no soporta el formato de vídeo.
        </video>
        <div class="video-vignette"></div>
    </div>

    <!-- Contenido que aparece del tirón al acabar el vídeo -->
    <div id="login-content">
        <h1>¿Cuál es tu empresa?</h1>
        <p>Escribe tu empresa para continuar...</p>

        <!-- Formulario de la empresa -->
        <div id="form-container">
            <input type="text" id="empresa" class="input-empresa" name="empresa" placeholder="Escribe el nombre de tu empresa" autocomplete="off">
            <button class="btn btn-ghost" onclick="postempresa()"><i class="fa-solid fa-arrow-right-to-bracket"></i> Seleccionar</button>
        </div>
    </div>
</div>

<script>
// Iniciar animación y configurar el callback al terminar el vídeo
document.addEventListener("DOMContentLoaded", () => {
    const video = document.getElementById("loginVideo");
    if (video) {
        // Aseguramos que NO esté en bucle
        video.loop = false;
        
        video.addEventListener("ended", () => {
            // 1. Activar el zoom del vídeo para acercar la pantalla del portátil
            const videoWrapper = document.getElementById("videoWrapper");
            if (videoWrapper) {
                videoWrapper.classList.add("zoomed");
            }
            
            // 2. Mostrar todo el contenido HTML (textos y formulario) del tirón
            const content = document.getElementById("login-content");
            if (content) {
                content.classList.add("visible");
            }
            
            // 3. Poner el foco en la entrada de texto
            const input = document.getElementById("empresa");
            if (input) {
                input.focus();
            }
        });
        
        video.play().catch(error => {
            console.log("Auto-play prevenido", error);
        });
    } else {
        // Fallback si por alguna razón falla el vídeo
        const content = document.getElementById("login-content");
        if (content) content.classList.add("visible");
    }
});

const POST_URL = "BACKEND/post_empresa.php";

function postempresa() {
    const input = document.getElementById("empresa");
    const empresa = input.value.trim();

    if (empresa === "") {
        alert("Introduce el nombre de la empresa");
        input.focus();
        return;
    }

    const fd = new FormData();
    fd.append("empresa", empresa);

    fetch(POST_URL, {
        method: "POST",
        body: fd
    })
    .then(response => response.json())
    .then(data => {
        console.log("Respuesta del servidor:", data);
        if (data.success) {
            localStorage.setItem("empresa", empresa);
            window.location.href = "pages/inicio.html";
        } else {
            alert(data.error || "Ha ocurrido un error.");
        }
    })
    .catch(error => {
        console.error("ERROR:", error);
        alert("Error al conectar con el servidor.");
    });
}
</script>

</body>
</html>
