<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio MAIS</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --primary: #ffffff;
    --secondary: #333333;
    --accent: #b91c1c;
    --glass: transparent;
    --radius: 8px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding: 20px 0;
    background: #000000 !important;
}

/* Contenedor principal */
.container{
    position:relative;
    text-align:center;
    padding:30px 20px;
    background: transparent;
    color:white;
    width:min(95%, 540px);
    max-width:540px;
    animation: fadeInUp 1s ease;
}

/* Animación entrada */
@keyframes fadeInUp{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}

/* 🎥 CONTENEDOR DE VÍDEO CON ESTILO PREMIUM */
.video-container {
    display: flex;
    justify-content: center;
    margin-bottom: 30px;
}

.video-container video {
    width: 280px;      /* Tamaño óptimo de visualización */
    height: auto;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(255,255,255,0.06);
    border: 1px solid #1a1a1a;
    background: #000;
}

/* 📝 ESTILOS ORIGINALES DE TEXTO (Poppins, Blanco, Centrado) */
h1 {
    font-size: 2.6rem;
    font-weight: 700;
    margin-bottom: 15px;
    letter-spacing: 1px;
    color: #ffffff;
    min-height: 48px;
}

p {
    opacity: 0.9;
    margin-bottom: 35px;
    font-size: 1rem;
    color: #ffffff;
    min-height: 24px;
}

/* Formulario de empresa (animado al terminar de escribir) */
#form-container {
    opacity: 0;
    transform: translateY(15px);
    transition: opacity 0.8s ease, transform 0.8s ease;
    pointer-events: none;
}

#form-container.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}

/* Botón moderno */
.btn{
    position:relative;
    display:inline-block;
    padding:14px 35px;
    font-size:1.1rem;
    font-weight:600;
    border-radius: 50px;
    text-decoration:none;
    color:white;
    background: transparent;
    border: 1px solid white;
    overflow:hidden;
    transition:0.4s ease;
}

.btn:hover{
    transform:translateY(-4px);
    background: white;
    color: black;
}

.btn-ghost{
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    padding:12px 30px;
    border-radius: 50px;
    cursor: pointer;
    font-weight:600;
    transition: 0.3s;
}
.btn-ghost:hover{ 
    background: var(--accent); 
    color: white; 
    box-shadow: 0 0 12px rgba(185, 28, 28, 0.4);
}

/* Input moderno */
input.input-empresa{
    width:100%;
    padding:12px 14px;
    margin:10px 0 20px 0;
    border-radius:12px;
    border: 1px solid #333;
    background: rgba(10, 10, 10, 0.5);
    color: white;
    outline: none;
    transition: 0.3s;
    text-align: center;
}
input.input-empresa:focus {
    border-color: var(--accent);
    box-shadow: 0 0 8px rgba(185, 28, 28, 0.5);
}
input.input-empresa::placeholder{ color: rgba(255,255,255,0.4); }

@media(max-width:600px){
    body { padding: 16px 0; }
    .container{padding:32px 20px; width:92%;}
    .btn-ghost{width:100%; padding:14px 20px;}
    h1 { font-size: 2rem; min-height: 72px; }
}
</style>
</head>

<body>

<div class="container">
    
    <!-- Contenedor del Vídeo subido animacionindex.mp4 -->
    <div class="video-container">
        <video id="loginVideo" autoplay loop muted playsinline>
            <source src="assets/videos/animacionindex.mp4" type="video/mp4">
            Tu navegador no soporta el formato de vídeo.
        </video>
    </div>

    <!-- Título y Subtítulo originales -->
    <h1 id="typing-header"></h1>
    <p id="typing-subheader"></p>

    <!-- Formulario de la empresa (se despliega al acabar) -->
    <div id="form-container">
        <input type="text" id="empresa" class="input-empresa" name="empresa" placeholder="Escribe el nombre de tu empresa" autocomplete="off">
        <button class="btn btn-ghost" onclick="postempresa()"><i class="fa-solid fa-arrow-right-to-bracket"></i> Seleccionar</button>
    </div>
</div>

<script>
// Textos originales separados
const headerText = "¿Cuál es tu empresa?";
const subheaderText = "Escribe tu empresa para continuar...";

let headerIndex = 0;
let subheaderIndex = 0;
const speed = 45; // Velocidad de tecleo en milisegundos

function typeHeader() {
    const headerEl = document.getElementById("typing-header");
    if (headerIndex < headerText.length) {
        headerEl.textContent += headerText.charAt(headerIndex);
        headerIndex++;
        setTimeout(typeHeader, speed);
    } else {
        setTimeout(typeSubheader, 250);
    }
}

function typeSubheader() {
    const subheaderEl = document.getElementById("typing-subheader");
    if (subheaderIndex < subheaderText.length) {
        subheaderEl.textContent += subheaderText.charAt(subheaderIndex);
        subheaderIndex++;
        setTimeout(typeSubheader, speed);
    } else {
        // Al terminar de escribir ambos textos:
        // 1. Pausar el vídeo en el momento exacto en que termina de escribir (opcional, para dar realismo)
        const video = document.getElementById("loginVideo");
        if (video) {
            video.pause();
        }
        
        // 2. Desplegar el formulario de acceso
        const form = document.getElementById("form-container");
        form.classList.add("visible");
        document.getElementById("empresa").focus();
    }
}

// Iniciar animación al cargar la página
document.addEventListener("DOMContentLoaded", () => {
    // Asegurar que el vídeo se reproduzca al iniciar la escritura
    const video = document.getElementById("loginVideo");
    if (video) {
        video.play().catch(error => {
            console.log("Auto-play prevenido por el navegador, esperando interacción.", error);
        });
    }
    typeHeader();
});

const POST_URL = "BACKEND/post_empresa.php";

function postempresa() {
    const input = document.getElementById("empresa");
    const empresa = input.value.trim();

    if (empresa === "") {
        alert("Introduce el nombre de la empresa");
        input.focus();
        return;
    }

    const fd = new FormData();
    fd.append("empresa", empresa);

    fetch(POST_URL, {
        method: "POST",
        body: fd
    })
    .then(response => response.json())
    .then(data => {
        console.log("Respuesta del servidor:", data);
        if (data.success) {
            localStorage.setItem("empresa", empresa);
            window.location.href = "pages/inicio.html";
        } else {
            alert(data.error || "Ha ocurrido un error.");
        }
    })
    .catch(error => {
        console.error("ERROR:", error);
        alert("Error al conectar con el servidor.");
    });
}
</script>

</body>
</html>
