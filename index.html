<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio MAIS</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/site.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body class="login-page">

    <div class="container" id="mainContainer">

        <!-- Contenedor del Vídeo sin loop y grande de primeras (67% de ancho) -->
        <div class="video-wrapper" id="videoWrapper">
            <video id="loginVideo" autoplay muted playsinline>
                <source src="assets/videos/animacionindex (2).mp4" type="video/mp4">
                Tu navegador no soporta el formato de vídeo.
            </video>
            <div class="video-vignette"></div>
        </div>

        <!-- Contenido HTML del index (oculto por defecto durante la reproducción) -->
        <div id="login-content">
            <div id="logo" style="margin-bottom: 45px; text-align: center;">
                <img src="assets/images/logo.jpg" alt="MAIS Informática" style="max-width: 320px; height: auto; display: inline-block;">
            </div>
            <h1>¿Cuál es tu empresa?</h1>
            <p>Escribe tu empresa para continuar...</p>

            <!-- Formulario de la empresa -->
            <div id="form-container">
                <input type="text" id="empresa" class="input-empresa" name="empresa"
                    placeholder="Escribe el nombre de tu empresa" autocomplete="off">
                <button class="btn btn-ghost" onclick="postempresa()"><i class="fa-solid fa-arrow-right-to-bracket"></i>
                    Seleccionar</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const video = document.getElementById("loginVideo");
            const videoWrapper = document.getElementById("videoWrapper");
            const content = document.getElementById("login-content");
            const input = document.getElementById("empresa");

            if (video) {
                video.loop = false;
                let zoomTriggered = false;
                let endedTriggered = false;
                const maxDuration = 3.0; // Duración máxima en segundos

                function handleVideoEnd() {
                    if (endedTriggered) return;
                    endedTriggered = true;
                    video.pause();
                    videoWrapper.style.display = "none";
                    content.style.display = "block";
                    content.offsetHeight; // Forzar reflujo del DOM
                    content.classList.add("visible");
                    if (input) {
                        input.focus();
                    }
                }

                video.addEventListener("timeupdate", () => {
                    const current = video.currentTime;
                    // Se empieza a acercar 1.0 segundo antes de terminar (a los 2.0s)
                    if (current >= (maxDuration - 1.0)) {
                        if (!zoomTriggered) {
                            zoomTriggered = true;
                            videoWrapper.classList.add("zooming");
                        }
                    }
                    // Detener el vídeo al llegar a la duración máxima
                    if (current >= maxDuration) {
                        handleVideoEnd();
                    }
                });

                video.addEventListener("ended", () => {
                    handleVideoEnd();
                });

                video.muted = true;
                video.playsInline = true;

                video.play().catch(error => {
                    console.log("Auto-play prevenido por el navegador, saltando intro:", error);
                    handleVideoEnd();
                });
            } else {
                content.style.display = "block";
                content.classList.add("visible");
            }

            if (input) {
                input.addEventListener("keydown", (event) => {
                    if (event.key === "Enter") {
                        event.preventDefault();
                        postempresa();
                    }
                });
            }
        });

        const POST_URL = "BACKEND/post_empresa.php";

        function postempresa() {
            const input = document.getElementById("empresa");
            const empresa = input.value.trim();

            if (empresa === "") {
                alert("Introduce el nombre de la empresa");
                input.focus();
                return;
            }

            const fd = new FormData();
            fd.append("empresa", empresa);

            fetch(POST_URL, {
                method: "POST",
                body: fd
            })
                .then(response => response.json())
                .then(data => {
                    console.log("Respuesta del servidor:", data);
                    if (data.success) {
                        localStorage.setItem("empresa", empresa);
                        window.location.href = "pages/inicio.html";
                    } else {
                        alert(data.error || "Ha ocurrido un error.");
                    }
                })
                .catch(error => {
                    console.error("ERROR:", error);
                    alert("Error al conectar con el servidor.");
                });
        }
    </script>

</body>

</html>
