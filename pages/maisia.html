<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente MAIS_IA</title>

<!-- Fuente moderna -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- CSS Globales -->
<link rel="stylesheet" href="../assets/css/site.css">

<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    body {
        font-family: "Poppins", sans-serif;
        margin: 0;
        background: var(--color-bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    .chat-container {
        width: 100%;
        max-width: 900px;
        height: 90vh;
        background: #111111;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        overflow: hidden;
    }

    .chat-header {
        background: var(--border-color);
        padding: 20px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 2px solid var(--accent);
    }

    .chat-header h1 {
        margin: 0;
        font-size: 1.5rem;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .chat-header h1 i {
        color: var(--accent);
    }

    .btn-back {
        background: transparent;
        border: 1px solid var(--text-light);
        color: var(--text-light);
        padding: 8px 16px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.9rem;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .btn-back:hover {
        background: var(--text-light);
        color: #000;
    }

    .chat-messages {
        flex: 1;
        padding: 30px 24px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .message {
        max-width: 80%;
        display: flex;
        gap: 16px;
        animation: fadeIn 0.3s ease;
    }

    .message.bot {
        align-self: flex-start;
    }

    .message.user {
        align-self: flex-end;
        flex-direction: row-reverse;
    }

    .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 1.2rem;
    }

    .bot .avatar {
        background: #222222;
        color: var(--accent);
        border: 1px solid var(--border-color);
    }

    .user .avatar {
        background: var(--accent);
        color: #ffffff;
    }

    .message-content {
        background: #222222;
        padding: 16px 20px;
        border-radius: 12px;
        font-size: 0.95rem;
        line-height: 1.6;
    }

    .bot .message-content {
        border-top-left-radius: 4px;
        border: 1px solid var(--border-color);
    }

    .user .message-content {
        background: var(--accent);
        color: #fff;
        border-top-right-radius: 4px;
    }

    .chat-input-area {
        padding: 20px 24px;
        background: #1a1a1a;
        border-top: 1px solid var(--border-color);
        display: flex;
        gap: 12px;
    }

    .chat-input-area input {
        flex: 1;
        background: #222222;
        border: 1px solid var(--border-color);
        color: #fff;
        padding: 16px 20px;
        border-radius: 30px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s;
        font-family: inherit;
    }

    .chat-input-area input:focus {
        border-color: var(--accent);
    }

    .btn-send {
        background: var(--accent);
        color: white;
        border: none;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        font-size: 1.2rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s, background 0.2s;
    }

    .btn-send:hover {
        background: #dc2626;
        transform: scale(1.05);
    }

    .btn-send:active {
        transform: scale(0.95);
    }

    .typing-indicator {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 8px 0;
    }

    .dot {
        width: 8px;
        height: 8px;
        background: var(--text-light);
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Ocultar barra de scroll para estética limpia */
    .chat-messages::-webkit-scrollbar {
        width: 8px;
    }
    .chat-messages::-webkit-scrollbar-track {
        background: #111111; 
    }
    .chat-messages::-webkit-scrollbar-thumb {
        background: #333333; 
        border-radius: 4px;
    }
    .chat-messages::-webkit-scrollbar-thumb:hover {
        background: #555555; 
    }

    /* --- NUEVOS ESTILOS PARA EL VISOR DE PDF Y ESTRUCTURACIÓN DE TEXTO --- */
    #mainLayout {
        display: flex;
        width: 100%;
        max-width: 900px;
        height: 90vh;
        gap: 0;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        margin: 0 auto;
    }

    #mainLayout.pdf-open {
        max-width: 1600px;
        width: 96vw;
        gap: 20px;
    }

    .chat-container {
        flex: 1;
        transition: all 0.3s ease;
    }

    #pdfViewerContainer {
        width: 0;
        opacity: 0;
        background: #111111;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: none;
    }

    #mainLayout.pdf-open #pdfViewerContainer {
        width: 50%;
        opacity: 1;
        pointer-events: auto;
    }

    @media (max-width: 1024px) {
        #mainLayout.pdf-open {
            flex-direction: column;
            height: 95vh;
        }
        #mainLayout.pdf-open #pdfViewerContainer {
            width: 100%;
            height: 50%;
        }
    }

    .pdf-viewer-header {
        background: #1a1a1a;
        padding: 18px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 2px solid var(--accent);
        color: #fff;
        font-weight: 600;
        font-size: 1.1rem;
    }

    .pdf-viewer-header span {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .pdf-viewer-header span i {
        color: var(--accent);
    }

    .btn-close-pdf {
        background: transparent;
        border: 1px solid var(--text-light);
        color: var(--text-light);
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .btn-close-pdf:hover {
        background: var(--text-light);
        color: #000;
    }

    #pdfFrame {
        flex: 1;
        width: 100%;
        height: 100%;
        background: #222;
        border: none;
    }

    /* Estilos de las citas interactivas */
    .citation-pill {
        background: rgba(59, 130, 246, 0.15);
        border: 1px solid rgba(59, 130, 246, 0.3);
        color: #60a5fa;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 2px 4px;
        transition: all 0.15s ease;
        font-family: inherit;
    }

    .citation-pill:hover {
        background: rgba(59, 130, 246, 0.35);
        border-color: rgba(59, 130, 246, 0.5);
        color: #ffffff;
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(59, 130, 246, 0.25);
    }

    .citation-pill i {
        color: #93c5fd;
        font-size: 0.85rem;
    }

    /* Estructuración del texto */
    .chat-paragraph {
        margin: 0 0 12px 0;
    }
    .chat-paragraph:last-child {
        margin-bottom: 0;
    }

    .chat-list {
        margin: 0 0 12px 20px;
        padding: 0;
    }
    
    .chat-list li {
        margin-bottom: 6px;
        line-height: 1.6;
    }
    .chat-list li:last-child {
        margin-bottom: 0;
    }

    .message-content strong {
        color: #ffffff;
        font-weight: 600;
    }
</style>
</head>
<body>

<div id="mainLayout">
    <div class="chat-container">
        <div class="chat-header">
            <h1><i class="fa-solid fa-microchip"></i> MAIS_IA</h1>
            <a href="inicio.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Volver</a>
        </div>

        <div class="chat-messages" id="chatMessages">
            <!-- Mensaje Inicial -->
            <div class="message bot">
                <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="message-content">
                    ¡Hola! Soy <strong>MAIS_IA</strong>. Estoy aquí para ayudarte a resolver cualquier duda sobre el sistema de gestión MAIS. ¿En qué te puedo ayudar hoy?
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Escribe tu consulta aquí..." autocomplete="off" autofocus>
            <button id="sendBtn" class="btn-send"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="pdfViewerContainer">
        <div class="pdf-viewer-header">
            <span id="pdfTitle">
                <i class="fa-solid fa-file-pdf"></i> Visor de PDF
            </span>
            <button id="closePdfBtn" class="btn-close-pdf">
                <i class="fa-solid fa-xmark"></i> Cerrar
            </button>
        </div>
        <iframe id="pdfFrame" src=""></iframe>
    </div>
</div>

<script src="../assets/js/maisia.js"></script>

</body>
</html>
