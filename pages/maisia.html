<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente Maisito</title>

<!-- Fuente moderna -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- CSS Globales -->
<link rel="stylesheet" href="../assets/css/site.css">

<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body class="maisia-page">

<div id="mainLayout">
    <div class="chat-container">
        <div class="chat-header">
            <h1><i class="fa-solid fa-microchip"></i> Maisito</h1>
            <div class="chat-header-actions" style="display: flex; gap: 10px; align-items: center;">
                <button id="newChatBtn" class="btn-new-chat" title="Iniciar una nueva consulta"><i class="fa-solid fa-plus"></i> Nueva consulta</button>
                <a href="inicio.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Volver</a>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <!-- Mensaje Inicial -->
            <div class="message bot">
                <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="message-content">
                    ¡Hola! Soy <strong>Maisito</strong>, tu asistente de MAIS. Estoy aquí para ayudarte a resolver cualquier duda sobre nuestro sistema de gestión ERP. ¿En qué te puedo ayudar hoy?
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Escribe tu consulta aquí..." autocomplete="off" autofocus>
            <button id="sendBtn" class="btn-send"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="pdfViewerContainer">
        <div class="pdf-viewer-header">
            <span id="pdfTitle">
                <i class="fa-solid fa-file-pdf"></i> Visor de PDF
            </span>
            <div class="pdf-page-controls">
                <button id="prevPageBtn" class="btn-page-control"><i class="fa-solid fa-chevron-left"></i></button>
                <span id="pageIndicator">Pág. 1</span>
                <button id="nextPageBtn" class="btn-page-control"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <button id="closePdfBtn" class="btn-close-pdf">
                <i class="fa-solid fa-xmark"></i> Cerrar
            </button>
        </div>
        <iframe id="pdfFrame" src=""></iframe>
        <iframe id="youtubeFrame" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="display: none; width: 100%; height: calc(100% - 50px); border: none;"></iframe>
    </div>
</div>

<script src="../assets/js/maisia.js"></script>

</body>
</html>
