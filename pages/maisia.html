<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente MAIS_IA</title>

<!-- Fuente moderna -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- CSS Globales -->
<link rel="stylesheet" href="../assets/css/site.css">

<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    body {
        font-family: "Poppins", sans-serif;
        margin: 0;
        background: var(--color-bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    .chat-container {
        width: 100%;
        max-width: 900px;
        height: 90vh;
        background: #111111;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        overflow: hidden;
    }

    .chat-header {
        background: var(--border-color);
        padding: 20px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 2px solid var(--accent);
    }

    .chat-header h1 {
        margin: 0;
        font-size: 1.5rem;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .chat-header h1 i {
        color: var(--accent);
    }

    .btn-back {
        background: transparent;
        border: 1px solid var(--text-light);
        color: var(--text-light);
        padding: 8px 16px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.9rem;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .btn-back:hover {
        background: var(--text-light);
        color: #000;
    }

    .chat-messages {
        flex: 1;
        padding: 30px 24px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .message {
        max-width: 80%;
        display: flex;
        gap: 16px;
        animation: fadeIn 0.3s ease;
    }

    .message.bot {
        align-self: flex-start;
    }

    .message.user {
        align-self: flex-end;
        flex-direction: row-reverse;
    }

    .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 1.2rem;
    }

    .bot .avatar {
        background: #222222;
        color: var(--accent);
        border: 1px solid var(--border-color);
    }

    .user .avatar {
        background: var(--accent);
        color: #ffffff;
    }

    .message-content {
        background: #222222;
        padding: 16px 20px;
        border-radius: 12px;
        font-size: 0.95rem;
        line-height: 1.6;
    }

    .bot .message-content {
        border-top-left-radius: 4px;
        border: 1px solid var(--border-color);
    }

    .user .message-content {
        background: var(--accent);
        color: #fff;
        border-top-right-radius: 4px;
    }

    .chat-input-area {
        padding: 20px 24px;
        background: #1a1a1a;
        border-top: 1px solid var(--border-color);
        display: flex;
        gap: 12px;
    }

    .chat-input-area input {
        flex: 1;
        background: #222222;
        border: 1px solid var(--border-color);
        color: #fff;
        padding: 16px 20px;
        border-radius: 30px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s;
        font-family: inherit;
    }

    .chat-input-area input:focus {
        border-color: var(--accent);
    }

    .btn-send {
        background: var(--accent);
        color: white;
        border: none;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        font-size: 1.2rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s, background 0.2s;
    }

    .btn-send:hover {
        background: #dc2626;
        transform: scale(1.05);
    }

    .btn-send:active {
        transform: scale(0.95);
    }

    .typing-indicator {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 8px 0;
    }

    .dot {
        width: 8px;
        height: 8px;
        background: var(--text-light);
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Ocultar barra de scroll para estética limpia */
    .chat-messages::-webkit-scrollbar {
        width: 8px;
    }
    .chat-messages::-webkit-scrollbar-track {
        background: #111111; 
    }
    .chat-messages::-webkit-scrollbar-thumb {
        background: #333333; 
        border-radius: 4px;
    }
    .chat-messages::-webkit-scrollbar-thumb:hover {
        background: #555555; 
    }
</style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h1><i class="fa-solid fa-microchip"></i> MAIS_IA</h1>
        <a href="inicio.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Volver</a>
    </div>

    <div class="chat-messages" id="chatMessages">
        <!-- Mensaje Inicial -->
        <div class="message bot">
            <div class="avatar"><i class="fa-solid fa-robot"></i></div>
            <div class="message-content">
                ¡Hola! Soy <strong>MAIS_IA</strong>. Estoy aquí para ayudarte a resolver cualquier duda sobre el sistema de gestión MAIS. ¿En qué te puedo ayudar hoy?
            </div>
        </div>
    </div>

    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Escribe tu consulta aquí..." autocomplete="off" autofocus>
        <button id="sendBtn" class="btn-send"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
</div>

<script src="../assets/js/maisia.js"></script>

</body>
</html>
