<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba IA</title>
</head>
<body>

<input id="pregunta" style="width:400px;">
<button onclick="preguntar()">Preguntar</button>

<pre id="respuesta"></pre>

<script>

async function preguntar(){

    const pregunta=document.getElementById("pregunta").value;

    const r=await fetch("http://127.0.0.1:5000/chat",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            pregunta:pregunta
        })

    });

    const datos=await r.json();

    document.getElementById("respuesta").innerText=datos.respuesta;

}

</script>

</body>
</html>
